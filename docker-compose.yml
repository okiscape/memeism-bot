services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: memeism
            POSTGRES_USER: memeism
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U memeism"]
            interval: 5s
            timeout: 5s
            retries: 5
    bot:
        build: .
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_HOST: postgres
        volumes:
            - ./.env:/app/.env:ro
        restart: unless-stopped

volumes:
    pgdata:
